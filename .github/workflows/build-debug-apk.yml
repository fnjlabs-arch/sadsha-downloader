# SadSha Downloader — one-click TEST APK build.
#
# How to use:
#   1. Open the repo on GitHub -> Actions tab -> "Build debug APK".
#   2. Click "Run workflow" (or just push to main).
#   3. Wait ~10-20 min. The APK is published as a GitHub Release asset
#      on tag "test-build" (Actions artifacts are NOT used: the free-plan
#      artifact quota is exhausted account-wide).
# The APK is a DEBUG build signed with AGP's default debug keystore
# (auto-generated on the runner — never the Play Store key).
# Distribution is website/R2 only — a YouTube-capable downloader will
# very likely be rejected by Google Play. No release AAB is built here.

name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # The ubuntu runner already ships a full Android SDK. Do NOT use
      # android-actions/setup-android here: its built-in license-accept
      # step runs `sdkmanager --licenses` without piped input and fails
      # with exit code 1. Pipe `yes` ourselves instead.
      - name: Set up Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # NOTE: $GITHUB_PATH only applies to LATER steps, so use the full
          # sdkmanager path in this step.
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$APK" sadsha-downloader-arm64-v8a-debug.apk
          if gh release view test-build >/dev/null 2>&1; then
            gh release upload test-build sadsha-downloader-arm64-v8a-debug.apk --clobber
          else
            gh release create test-build sadsha-downloader-arm64-v8a-debug.apk \
              --title "SadSha Downloader - Test APK (latest)" \
              --notes "Latest debug test build (com.sadsha.downloader). Debug-signed: uninstall any older debug build first. Distribution is website/R2 only, not Play Store."
          fi
